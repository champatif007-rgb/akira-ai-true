<title>Akira AI - Study Assistant</title>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;800&display=swap" rel="stylesheet">
<style>
@property --a{syntax:'<angle>';initial-value:0deg;inherits:false}
:root{--bg:#050819;--glass:rgba(255,255,255,.055);--line:rgba(150,165,255,.2);--tx:#eef0ff;--mute:#9aa3d6;--acc:#4f7bff;--acc2:#9a5cff;--cy:#52f0ff;--pk:#ff7ad9;--g1:#2a47d8;--g2:#8a3cff;--g3:#12b7d8;--pn1:#19205a;--pn2:#080b28}
:root[data-theme=light]{--bg:#e6eaff;--glass:rgba(255,255,255,.65);--line:rgba(60,70,160,.22);--tx:#14173a;--mute:#555d9a}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:'Exo 2',system-ui,sans-serif;color:var(--tx);background:var(--bg);display:flex;gap:16px;padding:16px;overflow:hidden}
#sky{position:fixed;inset:0;z-index:0}
.aur{position:fixed;border-radius:50%;filter:blur(90px);opacity:.55;z-index:0;animation:drift 18s ease-in-out infinite alternate}
.a1{width:520px;height:520px;background:var(--g1);top:-160px;right:10%}
.a2{width:480px;height:480px;background:var(--g2);bottom:-180px;right:-80px;animation-delay:-6s}
.a3{width:360px;height:360px;background:var(--g3);top:35%;left:25%;opacity:.25;animation-delay:-11s}
:root[data-theme=light] .aur{opacity:.25}
@keyframes drift{to{transform:translate(-70px,50px) scale(1.18)}}
button,select{font:inherit;color:inherit}
aside{width:272px;flex:none;z-index:2;display:flex;flex-direction:column;gap:12px;overflow:auto;padding:14px;border-radius:30px;background:linear-gradient(160deg,color-mix(in srgb,var(--pn1) 65%,transparent),color-mix(in srgb,var(--pn2) 78%,transparent));border:1px solid var(--line);backdrop-filter:blur(22px);box-shadow:0 30px 80px #0008,inset 0 1px 0 #fff2;animation:inl .8s cubic-bezier(.2,.9,.2,1) both}
:root[data-theme=light] aside{background:rgba(255,255,255,.7)}
@keyframes inl{from{opacity:0;transform:translateX(-40px) rotateY(18deg)}}
.brand{display:flex;align-items:center;gap:11px;padding:14px 16px;border-radius:22px;background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 55%,#0a0f30),color-mix(in srgb,var(--acc) 25%,#0a0f30));font-weight:800;font-size:22px;color:#fff;position:relative;overflow:hidden}
.brand::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(90deg,transparent,#fff5,transparent);transform:skewX(-20deg);animation:shine 4.5s infinite}
@keyframes shine{60%,100%{left:130%}}
.logo{width:26px;height:26px;position:relative}.logo i{position:absolute;background:#fff;border-radius:6px}
.logo i:nth-child(1){width:15px;height:15px;left:0;top:7px}.logo i:nth-child(2){width:11px;height:20px;right:0;top:0;border-radius:6px 6px 6px 2px}
.btn{position:relative;overflow:hidden;border:1px solid var(--line);background:var(--glass);border-radius:18px;padding:12px 15px;cursor:pointer;text-align:left;transition:transform .2s,border-color .2s,box-shadow .2s;display:flex;align-items:center;gap:10px}
.btn:hover{transform:translateX(4px);border-color:var(--acc);box-shadow:0 0 22px color-mix(in srgb,var(--acc) 27%,transparent)}
.btn.main{background:linear-gradient(135deg,var(--acc),var(--acc2));border:0;color:#fff;font-weight:600;box-shadow:0 8px 28px color-mix(in srgb,var(--acc2) 40%,transparent)}
.rip{position:absolute;border-radius:50%;background:#fff6;transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}
h4{margin:6px 6px 0;font-size:13px;color:var(--mute);font-weight:600}
#chats{display:flex;flex-direction:column;gap:7px;overflow:auto;min-height:36px;max-height:180px}
#chats .btn{font-size:14px;padding:9px 12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:pop .4s both}
#chats .btn.on{border-color:var(--cy);background:color-mix(in srgb,var(--acc) 15%,transparent);box-shadow:0 0 18px color-mix(in srgb,var(--cy) 20%,transparent)}
.sel{display:flex;flex-direction:column;gap:5px}
select{width:100%;background:var(--glass);border:1px solid var(--line);border-radius:15px;padding:10px;transition:.2s}
select:hover,select:focus{border-color:var(--acc);outline:0;box-shadow:0 0 16px color-mix(in srgb,var(--acc) 27%,transparent)}
select option{color:#111}
#fbar{height:4px;border-radius:4px;background:#fff1;overflow:hidden;margin:-4px 4px 0}#fbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cy),var(--acc2));transition:width 1s linear}
main{flex:1;display:flex;flex-direction:column;min-width:0;z-index:1;position:relative}
.top{display:flex;gap:12px;align-items:center;margin-bottom:6px}
.pill{border:1px solid var(--line);background:var(--glass);border-radius:999px;padding:9px 18px;cursor:pointer;backdrop-filter:blur(12px);transition:.2s;position:relative;overflow:hidden}
.pill:hover{border-color:var(--cy);box-shadow:0 0 20px color-mix(in srgb,var(--cy) 27%,transparent);transform:translateY(-2px)}
#menu{display:none}
.sp{flex:1}
.mini{width:38px;height:38px}
.orb{position:relative;width:100%;height:100%;border-radius:50%;animation:float 6s ease-in-out infinite}
.orb b{position:absolute;inset:0;border-radius:42% 58% 55% 45%/50% 42% 58% 50%;background:conic-gradient(from 0deg,var(--acc),var(--cy),var(--acc2),var(--pk),var(--acc));animation:spin 8s linear infinite,morph 7s ease-in-out infinite;box-shadow:0 0 70px color-mix(in srgb,var(--acc) 67%,transparent),inset 0 0 35px #fff7}
.orb u{position:absolute;inset:14%;border-radius:50%;background:radial-gradient(circle at 30% 25%,#fff9,transparent 55%);animation:morph 5s ease-in-out infinite reverse}
body.busy .orb b{animation-duration:1.6s,2s;filter:brightness(1.3) saturate(1.4)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes morph{50%{border-radius:58% 42% 45% 55%/45% 58% 42% 55%}}
@keyframes float{50%{transform:translateY(-8px)}}
#feed{flex:1;overflow:auto;padding:24px 6px 10px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
.hero{margin:auto;text-align:center;padding:34px 10px 10px}
.hero .big{width:150px;height:150px;margin:0 auto 22px}
.hero h1{font-size:clamp(24px,3.8vw,40px);margin:0 0 8px;font-weight:800;background:linear-gradient(100deg,var(--tx) 20%,var(--cy) 40%,var(--acc2) 60%,var(--tx) 80%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:txt 6s linear infinite}
@keyframes txt{to{background-position:-250% 0}}
.hero p{color:var(--mute);margin:0 0 22px}
.subs{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.sub{width:84px;padding:12px 6px;border-radius:20px;background:var(--glass);border:1px solid var(--line);cursor:pointer;font-size:12px;font-weight:600;transition:.25s;animation:pop .6s both;backdrop-filter:blur(10px)}
.sub b{display:block;font-size:26px;margin-bottom:4px;transition:.3s}
.sub:hover{transform:translateY(-8px) scale(1.06);border-color:var(--cy);box-shadow:0 12px 30px color-mix(in srgb,var(--cy) 27%,transparent)}.sub:hover b{transform:rotate(-12deg) scale(1.2)}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.9)}}
.m{max-width:780px;padding:13px 17px;border-radius:22px;line-height:1.6;border:1px solid var(--line);white-space:pre-wrap;word-wrap:break-word;animation:msg .45s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes msg{from{opacity:0;transform:translateY(16px) scale(.94)}}
.m.u{align-self:flex-end;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border:0;border-bottom-right-radius:6px;box-shadow:0 10px 30px color-mix(in srgb,var(--acc2) 33%,transparent);transform-origin:right bottom}
.m.a{align-self:flex-start;background:var(--glass);backdrop-filter:blur(12px);border-bottom-left-radius:6px;transform-origin:left bottom}
.m img{max-width:240px;border-radius:14px;display:block;margin-bottom:8px}
.m svg{max-width:100%;height:auto;background:#0003;border-radius:14px}
.m table{border-collapse:collapse;margin:8px 0}.m td{border:1px solid var(--line);padding:5px 12px}
.m code{background:#0005;padding:1px 6px;border-radius:6px}.m pre{background:#0006;padding:12px;border-radius:14px;overflow:auto;white-space:pre}
.dots span{display:inline-block;width:9px;height:9px;margin:3px;border-radius:50%;background:var(--cy);animation:bn 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes bn{50%{transform:translateY(-9px);opacity:.4}}
.modes{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;padding:16px 2px 12px}
.mode{--rx:0deg;--ry:0deg;--mx:50%;--my:50%;min-width:0;height:88px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px 6px;border-radius:22px;border:1px solid var(--line);background:radial-gradient(circle at var(--mx) var(--my),color-mix(in srgb,var(--cy) 27%,transparent),transparent 60%),var(--glass);cursor:pointer;text-align:center;font-weight:600;font-size:15px;transform:perspective(600px) rotateX(var(--rx)) rotateY(var(--ry));transition:transform .15s,box-shadow .3s,background .3s;backdrop-filter:blur(12px);animation:pop .6s both}
.mode b{display:block;font-size:28px;line-height:1;margin:0;transition:.3s}.mode:hover b{transform:translateY(-3px) scale(1.2)}
.mode.on{background:linear-gradient(160deg,color-mix(in srgb,var(--acc) 80%,#fff),var(--acc));color:#fff;border-color:transparent;box-shadow:0 14px 40px color-mix(in srgb,var(--acc) 53%,transparent),0 0 0 1px #fff3 inset;animation:pop .6s both,glow 2.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 14px 56px color-mix(in srgb,var(--cy) 53%,transparent),0 0 0 1px #fff4 inset}}
.box{position:relative;border-radius:28px;padding:12px;background:linear-gradient(160deg,color-mix(in srgb,var(--pn1) 70%,transparent),color-mix(in srgb,var(--pn2) 82%,transparent));backdrop-filter:blur(18px)}
:root[data-theme=light] .box{background:rgba(255,255,255,.75)}
.box::before{content:"";position:absolute;inset:-1.5px;border-radius:29px;padding:1.5px;background:conic-gradient(from var(--a),transparent 0 55%,var(--cy),var(--acc2),transparent 95%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:ang 4s linear infinite;opacity:.45;transition:opacity .3s;pointer-events:none}
.box:focus-within::before{opacity:1;animation-duration:2s}
@keyframes ang{to{--a:360deg}}

textarea{flex:1;resize:none;background:transparent;border:0;outline:0;color:var(--tx);font:inherit;font-size:16px;padding:9px;max-height:140px}
textarea::placeholder{color:var(--mute)}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:6px 4px 0;font-size:13px}
.chip{border:1px solid var(--acc);border-radius:999px;padding:6px 14px;cursor:pointer;background:transparent;transition:.25s}
.chip:hover{transform:translateY(-2px)}.chip.on{background:linear-gradient(135deg,var(--acc),var(--acc2));border-color:transparent;color:#fff;box-shadow:0 6px 20px color-mix(in srgb,var(--acc2) 40%,transparent)}
.go{border:0;border-radius:50%;width:46px;height:46px;cursor:pointer;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-size:19px;transition:.25s;position:relative;overflow:hidden;box-shadow:0 8px 24px color-mix(in srgb,var(--acc2) 47%,transparent)}
.go:hover{transform:scale(1.12) rotate(-12deg)}.go:active{transform:scale(.9)}
.ic{border:0;background:transparent;font-size:20px;cursor:pointer;width:40px;height:40px;border-radius:50%;transition:.2s}.ic:hover{background:#fff1;transform:scale(1.15)}
.ic.rec{background:#ff4d6d55;animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px #ff4d6d00;transform:scale(1.1)}}
.note{text-align:center;font-size:12px;color:var(--mute);margin:9px 0 0}
dialog{background:var(--pn2);color:#fff;border:1px solid var(--line);border-radius:24px;padding:24px;max-width:420px}
dialog[open]{animation:pop .35s both}dialog::backdrop{background:#000a;backdrop-filter:blur(6px)}
dialog input{width:100%;padding:11px;border-radius:14px;border:1px solid var(--line);background:#0006;color:#fff;margin:12px 0}
#toast{position:fixed;bottom:26px;left:50%;transform:translate(-50%,90px);background:var(--pn1);border:1px solid var(--cy);padding:12px 22px;border-radius:999px;z-index:9;transition:.4s cubic-bezier(.2,.9,.3,1.3);color:#fff}
#toast.on{transform:translate(-50%,0)}
@media(max-width:900px){.modes{display:flex;overflow-x:auto;padding:16px 8px 14px;margin:0 -8px}.mode{flex:none;width:96px}}
@media(max-width:760px){html,body{height:100dvh}.top{gap:8px;flex-wrap:wrap}.top .mini{display:none}.top .pill{padding:0 12px;height:36px;font-size:13px}.sw{gap:6px;padding:0 10px}.sw i{width:16px;height:16px}.bar{gap:6px}.opt select{max-width:100px}.vr{display:none}.go{width:42px;height:42px}.modes{padding:12px 8px}.mode{width:84px;height:80px;font-size:13px}.hero h1{font-size:22px}.sub{width:76px}.m{max-width:92%}body{padding:8px}aside{position:fixed;left:8px;top:8px;bottom:8px;z-index:5;transform:translateX(-115%);transition:.3s;width:285px;animation:none}aside.open{transform:none}#menu{display:block}.hero .big{width:110px;height:110px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.si{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tool,.opt svg,.chip svg,.go svg{stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tool{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--glass);display:grid;place-items:center;cursor:pointer;transition:.25s;position:relative}
.tool svg{width:20px;height:20px}
.tool:hover{transform:translateY(-3px);border-color:var(--cy);color:var(--cy);box-shadow:0 8px 22px color-mix(in srgb,var(--cy) 27%,transparent)}
.tool.rec{background:#ff4d6d33;border-color:#ff4d6d;color:#ff8aa0;animation:pulse 1s infinite}
.tool.has{border-color:var(--cy);color:var(--cy);box-shadow:0 0 18px color-mix(in srgb,var(--cy) 33%,transparent)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:6px 2px 0}

.opt svg{width:16px;height:16px;color:var(--cy);flex:none}
.opt::after{content:"";position:absolute;right:12px;top:14px;width:6px;height:6px;border-right:1.5px solid var(--mute);border-bottom:1.5px solid var(--mute);transform:rotate(45deg)}
.opt:hover,.opt:focus-within{border-color:var(--cy);box-shadow:0 0 16px color-mix(in srgb,var(--cy) 20%,transparent)}
.opt select{appearance:none;-webkit-appearance:none;background:transparent;border:0;border-radius:0;padding:0;width:auto;max-width:125px;font-size:13px;outline:0;cursor:pointer;box-shadow:none!important;text-overflow:ellipsis}
.chip{display:flex;align-items:center;gap:6px;height:36px;padding:0 14px}.chip svg{width:16px;height:16px}
.go svg{width:21px;height:21px;margin:auto;display:block}
textarea{display:block;width:100%;padding:10px 12px 8px}
.sw{display:flex;gap:8px;align-items:center;padding:0 12px;height:38px}

aside{padding:12px;gap:12px;border-radius:34px}
.grp{border:1px solid var(--line);border-radius:26px;padding:10px;display:flex;flex-direction:column;gap:9px;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}

/* ---- page format panel ---- */
body{font-family:var(--ff,'Exo 2',system-ui,sans-serif)}
.m{font-size:var(--fs,16px);line-height:var(--lh,1.6)}
textarea{font-size:var(--fs,16px)}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
#feed{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.aa{font-size:15px;font-weight:800;letter-spacing:-.5px}
#bd{position:fixed;inset:0;background:rgba(2,4,20,.55);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .25s;z-index:4}
#bd.on{opacity:1;pointer-events:auto}
#fmt{position:fixed;top:70px;right:16px;width:330px;max-width:calc(100vw - 24px);z-index:8;padding:16px;border-radius:26px;background:linear-gradient(160deg,color-mix(in srgb,var(--pn1) 94%,transparent),color-mix(in srgb,var(--pn2) 97%,transparent));border:1px solid var(--line);box-shadow:0 30px 80px #000a;display:flex;flex-direction:column;gap:14px;opacity:0;transform:translateY(-10px) scale(.97);pointer-events:none;transition:.25s;transform-origin:top right}
#fmt.on{opacity:1;transform:none;pointer-events:auto}
:root[data-theme=light] #fmt{background:#fff}
.sh-head{display:flex;align-items:center;justify-content:space-between;font-size:17px}
.sh-head .tool{width:38px;height:38px}.sh-head svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.grab{display:none}
.fr{display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--mute)}
.fr em{font-style:normal;color:var(--tx);margin-left:6px}
.seg{display:flex;gap:4px;padding:4px;border-radius:16px;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.seg button{flex:1;border:0;background:transparent;border-radius:12px;padding:10px 6px;cursor:pointer;font-size:13px;transition:.2s;color:var(--tx)}
.seg button.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;box-shadow:0 6px 18px color-mix(in srgb,var(--acc) 45%,transparent)}
#fs{width:100%;accent-color:var(--acc);height:28px}
body.plain .m.a{background:none;border:0;border-bottom:1px solid var(--line);backdrop-filter:none;padding:4px 2px 18px;max-width:100%;width:100%;border-radius:0}
body.lite #sky,body.lite .aur{display:none}
body.lite *{backdrop-filter:none!important}
@media(max-width:760px){
body{padding:max(8px,env(safe-area-inset-top)) 8px max(8px,env(safe-area-inset-bottom));overscroll-behavior:none}
#fmt{top:auto;left:0;right:0;bottom:0;width:100%;max-width:none;border-radius:28px 28px 0 0;padding:12px 18px calc(18px + env(safe-area-inset-bottom));opacity:1;transform:translateY(105%);transform-origin:bottom;transition:transform .3s cubic-bezier(.2,.9,.3,1)}
#fmt.on{transform:none}
.grab{display:block;position:absolute;top:8px;left:50%;width:42px;height:4px;border-radius:4px;background:var(--line);transform:translateX(-50%)}
.sh-head{padding-top:12px}
textarea{font-size:max(16px,var(--fs,16px))}
.opt{height:44px}.opt::after{top:18px}.opt select{font-size:16px;max-width:140px}
.chip{height:44px}.tool{width:44px;height:44px}
.act button{width:42px;height:38px}
.sub,.mode,.m.a,.pill{backdrop-filter:none}
.a3{display:none}.aur{filter:blur(60px)}
.kb .modes,.kb .note,.kb .subs,.kb .hero p{display:none}
.seg button{padding:13px 6px;font-size:14px}
}

<script>
const $=id=>document.getElementById(id),L=localStorage;
const MODES={Homework:["📝","Solve step by step and explain why each step works."],Explain:["💡","Explain the concept simply with an analogy and an example."],Quiz:["❓","Quiz me: ask 5 questions one at a time, wait for my answer, then give feedback."],Writing:["✍️","Help with writing: improve, outline or draft, and say what you changed."],Planner:["📅","Make a realistic study plan with times and short breaks."],Draw:["🎨","Draw the idea as a clean inline SVG diagram inside a ```svg code block, plus a short caption."]};
const SUBS=[["Math","➗"],["Science","🧪"],["English","📖"],["Hindi","🪔"],["Social science","🌍"],["Computer science","💻"]];
let mode="Homework",hint=false,pics=true,img=null,chats=JSON.parse(L.akChats||"[]"),cur=null,theme=L.akTheme||"dark";
document.documentElement.dataset.theme=theme;
const save=()=>L.akChats=JSON.stringify(chats.slice(0,40));
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),2200)}
/* ===== CONNECT YOUR OWN AI HERE =====
   system   : instructions string (level, subject, language, mode, hint mode)
   messages : [{role:"user"|"assistant", content:"..."}]  (whole chat, last item is the new question)
   image    : data URL of the attached photo, or null
   Return the answer as a string (markdown, tables and ```svg blocks are rendered). */
async function callAI({system,messages,image}){
  const response = await fetch("/.netlify/functions/ask", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ system, messages, image })
  });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data.error || `Request failed (${response.status})`);
  if (!data.answer) throw new Error("The AI service returned an empty answer.");
  return data.answer;
}
/* palettes */
const PAL={nebula:{bg:"#050819",acc:"#4f7bff",acc2:"#9a5cff",cy:"#52f0ff",pk:"#ff7ad9",g1:"#2a47d8",g2:"#8a3cff",g3:"#12b7d8",pn1:"#19205a",pn2:"#080b28"},
sunset:{bg:"#14060d",acc:"#ff6b3d",acc2:"#ff3d8b",cy:"#ffd166",pk:"#ff9ad5",g1:"#c2410c",g2:"#be185d",g3:"#f59e0b",pn1:"#4a1620",pn2:"#1a0710"},
emerald:{bg:"#03120d",acc:"#10b981",acc2:"#06b6d4",cy:"#7dffc2",pk:"#a3e635",g1:"#047857",g2:"#0e7490",g3:"#65a30d",pn1:"#0c3d2e",pn2:"#04150f"},
crimson:{bg:"#12040a",acc:"#ef4444",acc2:"#a855f7",cy:"#ff8fa3",pk:"#fb7185",g1:"#b91c1c",g2:"#7e22ce",g3:"#e11d48",pn1:"#45101c",pn2:"#17050b"},
aqua:{bg:"#041018",acc:"#0ea5e9",acc2:"#3b82f6",cy:"#67e8f9",pk:"#a5b4fc",g1:"#0369a1",g2:"#1d4ed8",g3:"#06b6d4",pn1:"#0b3350",pn2:"#050f1a"}};
function setPal(n){const c=PAL[n]||PAL.nebula;for(const k in c)document.documentElement.style.setProperty("--"+k,c[k]);L.akPal=n;document.querySelectorAll("#sw i").forEach(i=>i.classList.toggle("on",i.dataset.p==n))}
$("sw").innerHTML=Object.entries(PAL).map(([n,c])=>`<i data-p="${n}" title="${n}" style="background:linear-gradient(135deg,${c.acc},${c.acc2});color:${c.acc}"></i>`).join("");
$("sw").onclick=e=>{const i=e.target.closest("i");if(i){setPal(i.dataset.p);toast("Colours: "+i.dataset.p)}};
setPal(L.akPal||"nebula");
/* ripple */
document.addEventListener("pointerdown",e=>{const b=e.target.closest(".btn,.pill,.go");if(!b)return;const r=b.getBoundingClientRect(),s=document.createElement("span");s.className="rip";const d=Math.max(r.width,r.height);s.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;b.appendChild(s);setTimeout(()=>s.remove(),600)});
/* starfield */
const cv=$("sky"),cx=cv.getContext("2d");let W,H,stars=[],mx=0,my=0,shoot=null;
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;stars=Array.from({length:Math.min(170,W/6|0)},()=>({x:Math.random()*W,y:Math.random()*H,z:Math.random()*.9+.1,p:Math.random()*6}))}
rs();addEventListener("resize",rs);addEventListener("pointermove",e=>{mx=e.clientX/W-.5;my=e.clientY/H-.5});
(function tick(t){cx.clearRect(0,0,W,H);if(theme=="dark"){stars.forEach(s=>{const a=.35+.65*Math.abs(Math.sin(t/900*s.z+s.p));cx.globalAlpha=a;cx.fillStyle="#fff";cx.beginPath();cx.arc(s.x-mx*30*s.z,s.y-my*30*s.z,s.z*1.6,0,7);cx.fill()});
if(!shoot&&Math.random()<.004)shoot={x:Math.random()*W*.7,y:Math.random()*H*.4,l:0};
if(shoot){const g=cx.createLinearGradient(shoot.x,shoot.y,shoot.x-90,shoot.y-45);g.addColorStop(0,"#fff");g.addColorStop(1,"transparent");cx.globalAlpha=1;cx.strokeStyle=g;cx.lineWidth=2;cx.beginPath();cx.moveTo(shoot.x,shoot.y);cx.lineTo(shoot.x-90,shoot.y-45);cx.stroke();shoot.x+=14;shoot.y+=7;if(++shoot.l>70)shoot=null}}
requestAnimationFrame(tick)})(0);
/* modes with tilt */
$("modes").innerHTML=Object.entries(MODES).map(([k,v],i)=>`<button class="mode${k==mode?" on":""}" data-m="${k}" style="animation-delay:${i*.07}s"><b>${v[0]}</b>${k}</button>`).join("");
$("modes").onclick=e=>{const b=e.target.closest(".mode");if(!b)return;mode=b.dataset.m;document.querySelectorAll(".mode").forEach(x=>x.classList.toggle("on",x==b));toast(mode+" mode")};
$("modes").onpointermove=e=>{const b=e.target.closest(".mode");if(!b)return;const r=b.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;b.style.setProperty("--ry",(x-.5)*26+"deg");b.style.setProperty("--rx",(.5-y)*26+"deg");b.style.setProperty("--mx",x*100+"%");b.style.setProperty("--my",y*100+"%")};
$("modes").onpointerleave=()=>document.querySelectorAll(".mode").forEach(b=>{b.style.setProperty("--rx","0deg");b.style.setProperty("--ry","0deg")});
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
function md(t){const svgs=[];t=t.replace(/```svg\n([\s\S]*?)```/g,(_,s)=>{svgs.push(s.replace(/<script[\s\S]*?<\/script>|\son\w+="[^"]*"/gi,""));return"@@S"+(svgs.length-1)+"@@"});
const codes=[];t=t.replace(/```\w*\n?([\s\S]*?)(```|$)/g,(_,c)=>{codes.push(c);return"@@C"+(codes.length-1)+"@@"});
t=esc(t).replace(/^\|(.+)\|\s*$/gm,l=>/^[\s|:-]+$/.test(l)?"":"<tr>"+l.slice(1,-1).split("|").map(c=>`<td>${c.trim()}</td>`).join("")+"</tr>").replace(/(<tr>[\s\S]*?<\/tr>\n?)+/g,m=>`<table>${m}</table>`).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`([^`]+)`/g,"<code>$1</code>").replace(/^#+\s*(.+)$/gm,"<b>$1</b>");
return t.replace(/@@S(\d+)@@/g,(_,i)=>svgs[i]).replace(/@@C(\d+)@@/g,(_,i)=>`<pre>${esc(codes[i])}</pre>`)}
const body=m=>m.think?`<div class="dots"><span></span><span></span><span></span></div>`:m.r=="user"?esc(m.t):md(m.t);
function draw(){const f=$("feed");
if(!cur||!cur.msgs.length){f.innerHTML=`<div class="hero"><div class="big"><div class="orb"><b></b><u></u></div></div><h1>Welcome to Akira AI<br>Your all-in-one study assistant</h1><p>${greet()}! Pick a subject to start, or just ask anything below.</p><div class="subs">${SUBS.map((s,i)=>`<button class="sub${$("subject").value==s[0]?" on":""}" data-s="${s[0]}" style="animation-delay:${.3+i*.08}s"><b>${s[1]}</b>${s[0]}</button>`).join("")}</div></div>`}
else f.innerHTML=cur.msgs.map((m,i,a)=>`<div class="m ${m.r=="user"?"u":"a"}">${m.img?`<img src="${m.img}">`:""}${body(m)}${m.r!="user"&&!m.think?act(i==a.length-1):""}</div>`).join("");
f.scrollTop=f.scrollHeight;sync();
$("chats").innerHTML=chats.map((c,i)=>`<button class="btn${c==cur?" on":""}" data-i="${i}"><svg class="si" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.5 7.2L4 20l1-4.5A8 8 0 1 1 21 12z"/></svg><span>${esc(c.title)}</span><i class="x" data-x="${i}" title="Delete chat">×</i></button>`).join("")}
const IC=d=>`<svg viewBox="0 0 24 24">${d}</svg>`;
const greet=()=>{const h=new Date().getHours();return h<12?"Good morning":h<18?"Good afternoon":"Good evening"};
const act=last=>`<div class="act"><button data-a="copy" title="Copy">${IC('<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/>')}</button><button data-a="say" title="Read aloud">${IC('<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/>')}</button>${last?`<button data-a="redo" title="Answer again">${IC('<path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/>')}</button>`:""}</div>`;
function confetti(){const c=document.createElement("canvas");c.style.cssText="position:fixed;inset:0;z-index:99;pointer-events:none";c.width=innerWidth;c.height=innerHeight;document.body.appendChild(c);const x=c.getContext("2d"),st=getComputedStyle(document.documentElement),cols=["--acc","--acc2","--cy","--pk"].map(v=>st.getPropertyValue(v).trim());
const P=Array.from({length:140},()=>({x:innerWidth/2,y:innerHeight*.6,vx:(Math.random()-.5)*16,vy:-Math.random()*15-4,s:Math.random()*7+4,c:cols[Math.random()*4|0],r:Math.random()*6}));let f=0;
(function go(){x.clearRect(0,0,c.width,c.height);P.forEach(q=>{q.vy+=.35;q.x+=q.vx;q.y+=q.vy;q.r+=.2;x.fillStyle=q.c;x.save();x.translate(q.x,q.y);x.rotate(q.r);x.fillRect(-q.s/2,-q.s/4,q.s,q.s/2);x.restore()});if(++f<130)requestAnimationFrame(go);else c.remove()})()}
$("feed").onclick=e=>{const a=e.target.closest("[data-a]");if(a){const el=a.closest(".m"),i=[...$("feed").children].indexOf(el),m=cur&&cur.msgs[i];if(!m)return;
if(a.dataset.a=="copy"){navigator.clipboard&&navigator.clipboard.writeText(m.t).then(()=>toast("Copied"),()=>toast("Could not copy"))}
if(a.dataset.a=="say"){if(!window.speechSynthesis)return toast("Read aloud is not supported here");if(speechSynthesis.speaking){speechSynthesis.cancel();return}speechSynthesis.speak(new SpeechSynthesisUtterance(m.t.replace(/```[\s\S]*?```/g," ").replace(/[*#`|_]/g,"")))}
if(a.dataset.a=="redo"&&i==cur.msgs.length-1&&i>0){const u=cur.msgs[i-1];cur.msgs.splice(i-1,2);$("q").value=u.t=="(photo)"?"":u.t;img=u.img||null;if(img){$("cam").classList.add("has");$("att").style.display="block"}ask()}
return}
const b=e.target.closest(".sub");if(b){const on=$("subject").value==b.dataset.s;$("subject").value=on?"Any subject":b.dataset.s;sync();toast(on?"Subject cleared":"Subject: "+b.dataset.s);$("q").focus()}};
$("chats").onclick=e=>{const x=e.target.closest(".x");if(x){const k=+x.dataset.x;if(chats[k]===cur)cur=null;chats.splice(k,1);save();draw();return}const b=e.target.closest("[data-i]");if(b){cur=chats[b.dataset.i];draw();$("side").classList.remove("open")}};
$("clr").onclick=()=>{if(!chats.length)return toast("No chats to clear");if(confirm("Delete all saved chats?")){chats=[];cur=null;save();draw();toast("Chats cleared")}};
const DEF={level:2,subject:0,lang:0};
function sync(){document.querySelectorAll(".sub").forEach(b=>b.classList.toggle("on",b.dataset.s==$("subject").value));
for(const id in DEF){const e=$(id);e.closest(".opt").classList.toggle("set",e.selectedIndex!==DEF[id])}}
["level","subject","lang"].forEach(id=>$(id).addEventListener("change",sync));
$("newc").onclick=()=>{cur=null;draw();$("side").classList.remove("open")};
$("menu").onclick=()=>$("side").classList.toggle("open");
$("theme").onclick=()=>{theme=theme=="dark"?"light":"dark";document.documentElement.dataset.theme=theme;L.akTheme=theme};
$("hint").onclick=e=>{e.currentTarget.classList.toggle("on",hint=!hint);toast(hint?"Hint mode on":"Hint mode off")};
$("pics").onclick=e=>e.currentTarget.classList.toggle("on",pics=!pics);
$("cam").onclick=()=>$("file").click();
$("file").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{img=r.result;$("cam").classList.add("has");$("att").style.display="block"};r.readAsDataURL(f)};
$("rm").onclick=()=>{$("cam").classList.remove("has");img=null;$("att").style.display="none";$("file").value=""};
$("save").onclick=()=>{if(!cur)return toast("Nothing to save yet");const t=cur.msgs.map(m=>(m.r=="user"?"You: ":"Akira: ")+m.t).join("\n\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/plain"}));a.download="akira-chat.txt";a.click()};
$("mic").onclick=()=>{const S=window.SpeechRecognition||window.webkitSpeechRecognition;if(!S)return toast("Voice input is not supported in this browser");const r=new S(),b=$("mic");b.classList.add("rec");r.onresult=e=>$("q").value+=e.results[0][0].transcript;r.onend=()=>b.classList.remove("rec");r.start()};
let t=1500,iv=null;const fb=$("fbar").firstChild;$("focus").onclick=()=>{if(iv){clearInterval(iv);iv=null;t=1500;$("ft").textContent="Focus 25:00";fb.style.width=0;return}toast("Focus started. You got this");iv=setInterval(()=>{t--;$("ft").textContent="Focus "+String(t/60|0).padStart(2,"0")+":"+String(t%60).padStart(2,"0");fb.style.width=(1500-t)/15+"%";if(t<=0){clearInterval(iv);iv=null;t=1500;fb.style.width=0;$("ft").textContent="Focus 25:00";{const d=new Date().toDateString(),o=JSON.parse(L.akFocus||"{}"),n=(o.d==d?o.n:0)+1;L.akFocus=JSON.stringify({d,n});confetti();toast("Session "+n+" done today. Take a 5 minute break")}}},1000)};
$("q").addEventListener("input",e=>{e.target.style.height="auto";e.target.style.height=e.target.scrollHeight+"px"});
$("q").addEventListener("keydown",e=>{if(e.key=="Enter"&&!e.shiftKey){e.preventDefault();ask()}});
$("ask").onclick=ask;
/* typed placeholder */
const EX=["Explain quantum computing in simple terms","Solve 3x + 7 = 22 step by step","Quiz me on the water cycle","Make a 3 day study plan for my science test","Draw the parts of a plant cell"];let ei=0,ci=0,dir=1;
setInterval(()=>{const s=EX[ei];ci+=dir;if(ci>s.length+14){dir=-1}if(ci<=0){dir=1;ei=(ei+1)%EX.length}$("q").placeholder="Example: “"+s.slice(0,Math.max(0,Math.min(ci,s.length)))+"|”"},70);
async function ask(){const q=$("q").value.trim();if(!q&&!img)return;if(!cur){cur={title:(q||"Photo question").slice(0,34),msgs:[]};chats.unshift(cur)}
cur.msgs.push({r:"user",t:q||"(photo)",img});const photo=img;$("q").value="";$("q").style.height="auto";$("rm").click();
const sys=`You are Akira, a friendly study assistant. Student level: ${$("level").value}. Subject: ${$("subject").value}. Answer language: ${$("lang").value=="Same as my question"?"the same language as the question":$("lang").value}. Mode: ${MODES[mode][1]} ${hint?"Hint mode: do NOT give the full answer; guide with hints and questions step by step.":""} ${pics?"Use tables and simple SVG diagrams (in ```svg blocks) when they help.":"No diagrams."} Keep it clear and age-appropriate.`;
const hist=cur.msgs.map(m=>({role:m.r=="user"?"user":"assistant",content:m.t}));
const box={r:"model",t:"",think:true};cur.msgs.push(box);draw();document.body.classList.add("busy");
let ans;try{ans=await callAI({system:sys,messages:hist,image:photo})}catch(e){ans="Something went wrong: "+(e.message||e)}
document.body.classList.remove("busy");box.think=false;
const el=$("feed").lastChild,w=ans.split(/(\s+)/);let i=0;
await new Promise(res=>{const id=setInterval(()=>{i+=6;box.t=w.slice(0,i).join("");el.innerHTML=md(box.t);$("feed").scrollTop=$("feed").scrollHeight;if(i>=w.length){clearInterval(id);res()}},28)});
box.t=ans;save();draw()}
/* ---- page format ---- */
const FD={fs:16,lh:"1.6",ff:"modern",layout:"bubbles",fx:"full"},FF={modern:"'Exo 2',system-ui,sans-serif",clean:"system-ui,-apple-system,'Segoe UI',Roboto,sans-serif",serif:"Georgia,'Times New Roman',serif"};
let F={...FD};try{F={...FD,...JSON.parse(L.akFmt||"{}")}}catch(e){}
function fmtApply(){const r=document.documentElement.style;r.setProperty("--fs",F.fs+"px");r.setProperty("--lh",F.lh);r.setProperty("--ff",FF[F.ff]||FF.modern);document.body.classList.toggle("plain",F.layout=="plain");document.body.classList.toggle("lite",F.fx=="lite");$("fs").value=F.fs;$("fsv").textContent=F.fs+"px";document.querySelectorAll("#fmt .seg").forEach(g=>g.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.v==String(F[g.dataset.k]))));L.akFmt=JSON.stringify(F)}
const mob=()=>innerWidth<=760;
function upd(){$("bd").classList.toggle("on",(mob()&&$("side").classList.contains("open"))||$("fmt").classList.contains("on"))}
const openFmt=()=>{$("fmt").classList.add("on");upd()},closeFmt=()=>{$("fmt").classList.remove("on");upd()};
new MutationObserver(upd).observe($("side"),{attributes:true,attributeFilter:["class"]});
$("fmtb").onclick=e=>{e.stopPropagation();$("fmt").classList.contains("on")?closeFmt():openFmt()};
$("fclose").onclick=closeFmt;
$("bd").onclick=()=>{closeFmt();$("side").classList.remove("open")};
$("fmt").addEventListener("click",e=>{const b=e.target.closest(".seg button");if(b){F[b.parentNode.dataset.k]=b.dataset.v;fmtApply()}});
$("fs").oninput=e=>{F.fs=+e.target.value;fmtApply()};
$("frst").onclick=()=>{F={...FD};fmtApply();toast("Format reset")};
fmtApply();
/* ---- mobile: keyboard fit + swipe gestures ---- */
if(window.visualViewport){const vv=visualViewport,fit=()=>{const m=mob();document.body.style.height=m?vv.height+"px":"";document.body.classList.toggle("kb",m&&vv.height<innerHeight*.75);if(m)scrollTo(0,0)};vv.addEventListener("resize",fit);vv.addEventListener("scroll",()=>mob()&&scrollTo(0,0));fit()}
let tx=0,ty=0;
addEventListener("touchstart",e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(!mob())return;const sd=$("side");
if(Math.abs(dx)>70&&Math.abs(dy)<60){if(dx>0&&tx<28)sd.classList.add("open");if(dx<0&&sd.classList.contains("open"))sd.classList.remove("open")}
if(dy>60&&Math.abs(dx)<50&&e.target.closest("#fmt")&&ty<innerHeight-$("fmt").offsetHeight+70)closeFmt()},{passive:true});
document.addEventListener("keydown",e=>{if(e.key=="/"&&!/TEXTAREA|SELECT|INPUT/.test(document.activeElement.tagName)){e.preventDefault();$("q").focus()}if(e.key=="Escape"){$("side").classList.remove("open");closeFmt()}});
document.querySelector("main").addEventListener("click",()=>$("side").classList.remove("open"));
const persist=()=>L.akSet=JSON.stringify({level:$("level").selectedIndex,subject:$("subject").selectedIndex,lang:$("lang").selectedIndex,mode,hint,pics});
["click","change"].forEach(t=>document.addEventListener(t,()=>setTimeout(persist,0)));
try{const o=JSON.parse(L.akSet||"{}");if(o.level!=null){$("level").selectedIndex=o.level;$("subject").selectedIndex=o.subject;$("lang").selectedIndex=o.lang;mode=o.mode||mode;hint=!!o.hint;pics=o.pics!==false;document.querySelectorAll(".mode").forEach(b=>b.classList.toggle("on",b.dataset.m==mode));$("hint").classList.toggle("on",hint);$("pics").classList.toggle("on",pics)}}catch(e){}
draw();
</script></body></html>
